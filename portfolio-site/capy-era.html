<script>
(function () {
  var clips = document.querySelectorAll(".clip");
  clips.forEach(function (clip) {
    var video = clip.querySelector("video");
    if (!video) return;
    clip.addEventListener("click", function () {
      clips.forEach(function (other) {
        if (other === clip) return;
        var otherVideo = other.querySelector("video");
        if (!otherVideo) return;
        otherVideo.pause();
        other.classList.remove("is-playing");
      });
      if (video.paused) {
        video.muted = false;
        video.play();
        clip.classList.add("is-playing");
        if (window.gtag) {
          var card = clip.closest(".clip-card");
          var titleEl = card ? card.querySelector(".clip-title") : null;
          gtag("event", "video_play", {
            video_title: titleEl ? titleEl.textContent.trim() : "unknown",
            campaign: "Capy-Era",
            page_name: "capy-era"
          });
        }
      } else {
        video.pause();
        clip.classList.remove("is-playing");
      }
    });
    video.addEventListener("ended", function () {
      clip.classList.remove("is-playing");
    });
  });
})();
</script>

<script>

    var label = (link.getAttribute("aria-label") || link.textContent || "").replace(/\s+/g, " ").trim();
    gtag("event", "link_click", {
      link_url: link.href || "",
      link_text: label.slice(0, 100),

    });
  });
})();
